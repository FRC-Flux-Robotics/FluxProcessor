plugins {
    id 'java'
    id 'application'
}

group = 'frc.flux'
version = '2027.1.0'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(17)
    options.compilerArgs += ['-Xlint:all,-serial', '-Werror']
}

application {
    mainClass = 'frc.flux.processor.FluxProcessorMain'
}

dependencies {
    implementation files('libs/fluxfig-1.0.0.jar')
}

tasks.register('syncLocalFluxFig', Copy) {
    onlyIf { file('../FluxFig/dist/fluxfig.jar').exists() }
    from file('../FluxFig/dist/fluxfig.jar')
    into file('libs')
    rename { 'fluxfig-1.0.0.jar' }
}

compileJava.dependsOn 'syncLocalFluxFig'

tasks.register('runFluxProcessorTests', JavaExec) {
    group = 'verification'
    description = 'Runs the zero-dependency FluxProcessorTest suite with assertions enabled.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'frc.flux.processor.FluxProcessorTest'
    enableAssertions = true
}

tasks.named('test') {
    dependsOn tasks.named('runFluxProcessorTests')
}

tasks.register('spotlessApply') {
    group = 'formatting'
    description = 'Normalizes UTF-8 LF line endings and trims trailing whitespace across Java source files.'
    doLast {
        fileTree('src').matching { include '**/*.java' }.each { File f ->
            String original = f.getText('UTF-8')
            String normalized = original.replace('\r\n', '\n').split('\n', -1).collect { it.replaceAll(/[ \t]+$/, '') }.join('\n')
            if (!normalized.endsWith('\n')) {
                normalized += '\n'
            }
            if (normalized != original) {
                f.setText(normalized, 'UTF-8')
            }
        }
    }
}

tasks.register('spotlessCheck') {
    group = 'formatting'
    description = 'Checks that Java source files have clean UTF-8 LF line endings.'
    dependsOn 'spotlessApply'
}

jar {
    archiveFileName = 'flux-processor.jar'
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes(
            'Main-Class': 'frc.flux.processor.FluxProcessorMain',
            'Implementation-Title': 'FluxProcessor',
            'Implementation-Version': project.version
        )
    }
    doLast {
        copy {
            from archiveFile
            into file("${projectDir}/dist")
            rename { 'flux-processor.jar' }
        }
    }
}
