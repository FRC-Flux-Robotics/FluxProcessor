plugins {
    id 'java'
    id 'application'
}

group = 'frc.flux'
version = '0.1.0'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

application {
    mainClass = 'frc.flux.processor.FluxProcessorMain'
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

jar {
    manifest {
        attributes(
            'Main-Class': 'frc.flux.processor.FluxProcessorMain',
            'Implementation-Title': 'FluxProcessor',
            'Implementation-Version': project.version
        )
    }
}
